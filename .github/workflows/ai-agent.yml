name: Live AI Agent
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  respond:
    if: github.actor == 'jenle25'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Talk directly to DeepSeek
        run: |
          # Считываем файлы прямо из корня репозитория
          CONTEXT=$(cat meta-passport.md core-concepts.md)
          
          # Отправляем прямой запрос на сервер DeepSeek
          RESPONSE=$(curl -s -X POST "https://deepseek.com" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"deepseek-chat\", \"messages\": [{\"role\": \"system\", \"content\": \"Ты универсальный Суперагент проекта Формула Сознания. Вот контекст проекта: $CONTEXT\"}, {\"role\": \"user\", \"content\": \"${{ github.event.comment.body }}\"}]}")
          
          # Извлекаем чистый текст ответа
          TEXT_REPLY=$(echo "$RESPONSE" | jq -r '.choices.message.content // "Ошибка: Сервер вернул пустой ответ"')
          
          # Публикуем ответ в ветку задачи GitHub
          gh issue comment ${{ github.event.issue.number }} --body "$TEXT_REPLY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
